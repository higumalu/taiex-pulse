name: Probe data sources

# Can GitHub's runners reach TWSE, TPEx, TAIFEX and NDC at all? Everything else
# about running the daily update in CI depends on the answer.
on:
  # Weekly, so a source that stops answering GitHub's runners shows up as a
  # red run even in a week when the daily update looks fine.
  schedule:
    - cron: "0 1 * * 1"     # Monday 09:00 Taipei
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - scripts/probe_sources.py
      - .github/workflows/probe-sources.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe every source
        working-directory: scripts
        env:
          PYTHONIOENCODING: utf-8
        run: python -u probe_sources.py
