name: Probe data sources

# Can GitHub's runners reach TWSE, TPEx, TAIFEX and NDC at all? Everything else
# about running the daily update in CI depends on the answer.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - scripts/probe_sources.py
      - .github/workflows/probe-sources.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe every source
        working-directory: scripts
        env:
          PYTHONIOENCODING: utf-8
        run: python -u probe_sources.py
