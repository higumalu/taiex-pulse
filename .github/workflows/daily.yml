name: Daily update

# After the close, fetch the new trading day(s), append the daily aggregates
# to the `data` branch, rebuild the dashboard and publish it to GitHub Pages.
on:
  schedule:
    # 21:30 Taipei: margin balances and share counts come out in the evening.
    # Runs only from the default branch.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      fail_test:
        description: "Inject an error after the update, to check the failure path"
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - scripts/**
      - site/**
      - data/params.json
      - data/weights.json
      - requirements.txt
      - .github/workflows/daily.yml

# One run at a time: two runs pushing to the data branch would conflict.
concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      built: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: data
          path: data/store
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # Fails the job when a source raised something other than a network
      # error, or has had trouble in 3 runs in a row (see update_daily.py).
      # The steps below still run, so the data that did arrive is saved and
      # published; the run stays red.
      - name: Fetch new trading days
        id: fetch
        working-directory: scripts
        env:
          PYTHONIOENCODING: utf-8
          FAIL_TEST: ${{ inputs.fail_test }}
        run: python -u update_daily.py $([ "$FAIL_TEST" = "true" ] && echo --fail-test)

      # Before the build, so a failing build cannot cost the day's data.
      # Every table is upserted on its own, so a partial run is consistent.
      - name: Commit to the data branch
        if: ${{ !cancelled() && steps.fetch.outcome != 'skipped' }}
        working-directory: data/store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # meta.json carries a run timestamp; on its own it is not new data
          if git diff --quiet -- . ':!meta.json' && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "no new data"
          else
            git add -A
            git commit -m "Update through $(python3 -c "import csv;print(list(csv.reader(open('twse_daily.csv')))[-1][0])")"
            git push
          fi

      - name: Build dashboard data
        id: build
        if: ${{ !cancelled() && steps.fetch.outcome != 'skipped' }}
        working-directory: scripts
        env:
          PYTHONIOENCODING: utf-8
        run: python -u build_site_data.py

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - uses: actions/upload-pages-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          path: site

  deploy:
    needs: update
    # also after a failed fetch, as long as the site was built
    if: ${{ !cancelled() && needs.update.outputs.built == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
